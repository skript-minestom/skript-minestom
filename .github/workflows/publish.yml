name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_repoHapilyUsername: ${{ secrets.REPO_HAPILY_USERNAME }}
          ORG_GRADLE_PROJECT_repoHapilyPassword: ${{ secrets.REPO_HAPILY_PASSWORD }}
